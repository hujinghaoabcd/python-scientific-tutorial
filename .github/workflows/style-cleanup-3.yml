name: Content cleanup 3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final wording cleanup
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              ("，NumPy的世界充满乐趣！", "NumPy的世界充满乐趣！"),
              ("，数据分析之路才刚刚开始！", "数据分析之路才刚刚开始！"),
              ("都能搞定", "都可以实现"),
              ("什么都能搞定", "很多事情都可以实现"),
              ("继续加油！", ""),
              ("继续加油。", ""),
              ("✅", ""),
              ("❌", ""),
          ]

          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".md", ".ipynb"}:
                  continue
              text = path.read_text(encoding="utf-8")
              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding="utf-8", newline="")
                  changed.append(str(path))

          print(f"changed files: {len(changed)}")
          for path in changed:
              print(path)

      - name: Commit content changes
        shell: bash
        run: |
          rm -f .github/workflows/style-cleanup-3.yml
          git config user.name "hujinghaoabcd"
          git config user.email "42744442+hujinghaoabcd@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "内容修改"
          git push origin main
