name: Content cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tone-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adjust tutorial wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('.')

          common = {
              '超级友好': '比较友好',
              '用途超级广泛，几乎无所不能': '用途非常广泛',
              '社区超级强大，遇到问题不孤单': '社区成熟，学习资料丰富',
              '功能超级强大': '功能很强',
              '超级重要': '很重要',
              '超级方便': '很方便',
              '超级实用': '很实用',
              '快到飞起！': '速度优势很明显。',
              '效率高到飞起！': '效率会高很多。',
              '一行搞定！': '一行即可完成。',
              '几行代码，瞬间搞定！': '几行代码就可以完成。',
              '累死了！而且容易出错！': '步骤重复，而且容易出错。',
              '喝口咖啡就搞定了！': '几行代码即可批量完成。',
          }

          path_specific = {
              '01-python/01-Python简介和安装/01-Python简介和安装.md': {
                  '如果你还在犹豫要不要学Python，让我给你几个无法拒绝的理由：': '如果你还在犹豫要不要学 Python，可以先看看几个最直接的理由：',
                  'Python的代码读起来就像英语句子，超级友好！': 'Python 的代码通常比较接近自然语言，对初学者比较友好。',
                  '**手动操作**：要改100次，累死！': '**手动操作**：需要重复改很多次，既耗时也容易出错。',
                  '**总结**：Python就像一把万能钥匙，几乎什么锁都能开！而且它特别容易上手，这就是为什么这么多人选择Python的原因。': '**总结**：Python 的应用范围很广，同时上手门槛相对较低，这也是它被广泛使用的重要原因。',
                  '如果你在网上搜Python，可能会看到Python 2和Python 3两个版本。别纠结，直接选Python 3！': '如果你在网上搜 Python，可能会看到 Python 2 和 Python 3 两个版本。对于新学习者，直接选择 Python 3 即可。',
                  '4. **未来趋势**：所有新项目都用Python 3，学Python 2等于学了个"死语言"': '4. **当前生态**：主流库和新项目都以 Python 3 为基础，Python 2 已停止维护，不建议作为新的学习目标',
                  '**打个比方**：就像iPhone，虽然iPhone 6还能用，但你现在买新手机肯定买iPhone 15，对吧？Python 3就是那个"iPhone 15"！': '**简单理解**：现在开始学习 Python，直接从 Python 3 入门即可。',
                  '> **记住**：看到任何教程说学Python 2的，直接跳过！我们只学Python 3！': '> **提示**：新学习者只需要关注 Python 3；遇到旧版 Python 2 教程时，要注意其中的语法和库接口可能已经过时。',
              },
              '02-numpy/01-NumPy简介和安装/01-NumPy简介和安装.md': {
                  '如果你已经学过Python基础，那么恭喜你，你即将开启数据科学的大门！NumPy是Python数据科学生态系统的基石，掌握它，你就能处理各种数据、做科学计算、搞机器学习。就像学会了开车的基本操作后，现在要学开卡车了——更强大，更专业！': '如果你已经学过 Python 基础，接下来就可以进入 NumPy。它是 Python 数值计算生态中的基础工具，很多数据分析、科学计算和机器学习库都会用到它。可以把 Python 列表看作日常工具，而 NumPy 数组更适合成批处理数值数据。',
                  '**NumPy就是Python的"自动化仓库系统"**——专门为处理大量数值数据而设计的工具！': '**NumPy 可以理解为面向数值数据的“自动化仓库系统”**：它擅长按统一的数据类型组织数组，并对整批数据进行高效计算。',
                  '### 1. 性能优势 - 快到飞起！': '### 1. 性能优势',
                  '### 2. 简洁优雅 - 代码少了90%': '### 2. 向量化让代码更简洁',
                  '看到没？用NumPy，代码简洁了90%，而且更直观！这就是向量化的魅力！': '可以看到，NumPy 可以直接对整个数组进行运算，不必手写逐元素循环，这就是向量化带来的便利。',
                  '**打个比方**：NumPy就像学英语的字母表，学会了才能读单词、读句子、读文章。不学NumPy直接学Pandas，就像不认识字母就想读莎士比亚！': '**简单理解**：NumPy 提供了数组和向量化运算基础，理解这些概念后再学习 Pandas、SciPy 等库会更顺畅。',
              },
              '03-pandas/01-Pandas简介和安装/01-Pandas简介和安装.md': {
                  '如果你已经学过Python基础，甚至了解一点NumPy，那么恭喜你！你即将掌握数据分析领域最强大的工具之一。Pandas就像是给Excel插上了翅膀，让数据处理变得既简单又强大。就像学会了开车后，现在要学开飞机了——视野更广，能力更强！': '如果你已经学过 Python 基础，并了解一点 NumPy，就可以开始学习 Pandas。它主要面向表格和时间序列数据，能把很多原本需要手工完成的数据整理步骤写成可重复执行的代码。',
                  '**场景1：Excel噩梦**': '**场景1：用 Excel 处理较大的表格**',
                  '**场景3：用Pandas处理数据（天堂模式）**': '**场景3：用 Pandas 处理数据**',
                  '**Pandas就是"开了挂的Excel + Python的灵活性"**！': '**Pandas 可以理解为面向表格数据的 Python 工具集**。',
                  '**一句话总结**：从读取数据到清洗、分析、可视化，Pandas全包了！': '**一句话总结**：从读取、清洗到分组、统计和基础可视化，Pandas 可以覆盖常见的表格数据处理流程。',
                  '**累死了！而且容易出错！**': '**这种步骤重复，而且容易出错。**',
                  '**5行代码，喝口咖啡就搞定了！**': '**几行代码即可批量完成。**',
              },
              '05-statsmodels/02-线性回归/02-线性回归.md': {
                  '线性回归是统计建模中最基础、最重要的方法。掌握了线性回归，你就打开了统计建模的大门！': '线性回归是统计建模中最基础、最常用的方法之一，也是理解后续回归模型的重要起点。',
                  '**线性回归就是"画直线"**：': '**可以先把简单线性回归理解为“用一条直线描述变量关系”**：',
                  '# 这就是 OLS！': '# 这就是 OLS 的基本思想',
              },
              '06-linearmodels/01-面板数据基础/01-面板数据基础.md': {
                  '面板数据的结构和准备是一切的基础！这一章我们深入理解面板数据的组织形式，以及如何用 LinearModels 进行基础分析。': '面板数据的结构和准备是后续建模的基础。这一章先理解面板数据的组织形式，再学习如何用 LinearModels 进行基础分析。',
                  'print("  - 固定效应：控制了企业固定差异，更接近真实因果效应")': 'print("  - 固定效应：控制了不随时间变化的企业差异；是否具有因果解释仍取决于模型设定和识别假设")',
              },
          }

          changed = []
          for path in repo.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.md', '.ipynb'}:
                  continue
              rel = path.as_posix()
              text = path.read_text(encoding='utf-8')
              new = text

              # 保留通俗风格，只削弱高频夸张词。
              for old, repl in common.items():
                  new = new.replace(old, repl)

              # Python 基础模块里“继续加油”出现频率很高，保留鼓励句本身，只去掉这个重复尾巴。
              if rel.startswith('01-python/'):
                  new = new.replace('继续加油！', '')

              for old, repl in path_specific.get(rel, {}).items():
                  new = new.replace(old, repl)

              # Notebook 中包含与 Markdown 相同的教学文案，做同样的路径级处理。
              if path.suffix.lower() == '.ipynb':
                  md_rel = rel.replace('.ipynb', '.md')
                  for old, repl in path_specific.get(md_rel, {}).items():
                      new = new.replace(old, repl)

              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(rel)

          print(f'updated {len(changed)} files')
          for item in changed:
              print(item)
          PY

      - name: Validate repository
        run: python scripts/validate_tutorial.py

      - name: Commit content changes
        shell: bash
        run: |
          git config user.name "hujinghaoabcd"
          git config user.email "42744442+hujinghaoabcd@users.noreply.github.com"
          git rm .github/workflows/tone-cleanup.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "内容修改"
          git push origin main
